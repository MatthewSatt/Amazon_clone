services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amazon_clone
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d amazon_clone"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Production mode expects HTTPS (Secure cookies) and a Postgres
      # SCHEMA, so run in development mode on plain http://localhost
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DATABASE_URL: postgresql://amazon:password@db:5432/amazon_clone
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db-data:
